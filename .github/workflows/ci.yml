name: CI

# This repository does not take outside contributions. Every job runs only in
# bluesentinelsec/SuperMetroidX, and for a pull request only when its branch
# is in this repository, so forks and pull requests from forks run nothing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    if: >-
      github.repository == 'bluesentinelsec/SuperMetroidX' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxrender-dev libxss-dev libxtst-dev \
            libgl1-mesa-dev

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja cmake

      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install -y ninja make

      - name: Cache SDL
        uses: actions/cache@v4
        with:
          path: build/debug/_deps
          key: sdl3-3.4.18-${{ runner.os }}

      # Hosted runners never have the ROM; embedding is off so a stray one is never linked in.
      - name: Build and test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="/c/ProgramData/chocolatey/bin:/c/Program Files/Git/usr/bin:$PATH"
          fi
          make test CMAKE_ARGS=-DSMX_EMBED_ROM=OFF
          if [ -d build/debug/SuperMetroidX.app ]; then
            bin=build/debug/SuperMetroidX.app/Contents/MacOS/SuperMetroidX
          elif [ -f build/debug/SuperMetroidX.exe ]; then
            bin=build/debug/SuperMetroidX.exe
          else
            bin=build/debug/SuperMetroidX
          fi
          SDL_VIDEODRIVER=dummy "$bin" --smoke

      # The package each system's players would download, built without the
      # ROM and checked, never uploaded.
      - name: Package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="/c/ProgramData/chocolatey/bin:/c/Program Files/Git/usr/bin:$PATH"
          fi
          make package CMAKE_ARGS=-DSMX_EMBED_ROM=OFF
          ls -l build/release/dist

      - name: Check the package (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y desktop-file-utils appstream
          mkdir -p pkg && tar -xzf build/release/dist/SuperMetroidX-*.tar.gz -C pkg --strip-components=1
          id=io.github.bluesentinelsec.SuperMetroidX
          test -x pkg/bin/SuperMetroidX
          test -f pkg/share/icons/hicolor/256x256/apps/$id.png
          test -f pkg/share/doc/SuperMetroidX/README.txt
          test -f pkg/share/licenses/SuperMetroidX/LICENSE
          desktop-file-validate pkg/share/applications/$id.desktop
          appstreamcli validate --no-net --explain pkg/share/metainfo/$id.metainfo.xml
          pkg/bin/SuperMetroidX --version

      - name: Check the package (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/smx build/release/dist/SuperMetroidX-*.dmg
          app=/tmp/smx/SuperMetroidX.app
          plutil -lint "$app/Contents/Info.plist"
          test -f "$app/Contents/Resources/SuperMetroidX.icns"
          test -L /tmp/smx/Applications
          test -f /tmp/smx/LICENSE.txt
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/SuperMetroidX" --version
          hdiutil detach /tmp/smx

      - name: Check the package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir pkg && unzip -q build/release/dist/SuperMetroidX-*.zip -d pkg
          exe=$(echo pkg/*/SuperMetroidX.exe)
          objdump -p "$exe" > imports.txt
          grep -q "Windows GUI" imports.txt
          grep "DLL Name" imports.txt
          if grep -Ei "DLL Name: (libgcc|libwinpthread|libstdc|SDL3)" imports.txt; then exit 1; fi
          test -f pkg/*/README.txt
          test -f pkg/*/LICENSE.txt

  # The one job with the ROM: a Raspberry Pi 5 on the owner's network. The ROM
  # and the build trees stay on the Pi, outside the workspace (SMX_PI_ROM and
  # SMX_PI_BUILD come from the runner's .env), and nothing is uploaded. A
  # job-started hook on the Pi refuses jobs from anyone but the owner.
  raspberry-pi:
    name: raspberry-pi (ROM)
    if: >-
      github.repository == 'bluesentinelsec/SuperMetroidX' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, ARM64, smx-rom]
    timeout-minutes: 90
    concurrency:
      group: raspberry-pi
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Check the ROM
        run: |
          test -n "$SMX_PI_ROM" && test -f "$SMX_PI_ROM" && test -n "$SMX_PI_BUILD"
          echo "da957f0d63d14cb441d215462904c4fa8519c613  $SMX_PI_ROM" | sha1sum --check --quiet

      # Debug with the ROM built in: unit tests, the game against recorded
      # hashes (translated and interpreted), every play-test section, and the
      # shell starting on its built-in ROM.
      - name: Debug build and tests with the ROM
        run: make test BUILD_DIR="$SMX_PI_BUILD" CMAKE_ARGS="-DSMX_ROM=$SMX_PI_ROM -DSMX_EMBED_ROM=ON"

      - name: Release build and tests with the ROM
        run: make test-release BUILD_DIR="$SMX_PI_BUILD" CMAKE_ARGS="-DSMX_ROM=$SMX_PI_ROM -DSMX_EMBED_ROM=ON"
